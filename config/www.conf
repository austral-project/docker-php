[www]
user = www-data
group = www-data

listen = 9900
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

request_terminate_timeout = 120s

chdir = /
clear_env=no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on