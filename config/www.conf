
[www]
; user/group are only set when the container starts as root (see entrypoint)
${POOL_IDENTITY}

listen = 9900

pm = ${FPM_PM}
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_MAX_SPARE_SERVERS}
pm.max_requests = ${FPM_MAX_REQUESTS}

request_terminate_timeout = ${FPM_REQUEST_TERMINATE_TIMEOUT}

chdir = /
clear_env = no

; Send workers' stdout/stderr to the container log (docker logs)
catch_workers_output = yes

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
