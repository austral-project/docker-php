; Rendered by docker-entrypoint.sh (envsubst) -> ${PHP_RUN_DIR}/php-fpm.conf
; No "pid" directive: the container does not need a pid file (and /run is not writable as non-root).
[global]
error_log = /proc/self/fd/2
log_level = ${FPM_LOG_LEVEL}
daemonize = no
include = ${PHP_RUN_DIR}/fpm/pool.d/*.conf
